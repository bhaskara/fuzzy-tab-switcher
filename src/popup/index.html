<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Switch to</title>
    <link rel="stylesheet" href="popup.css" />

    <!-- Without these the browser cannot discover a module until it has
         fetched and parsed whichever module imports it, so the graph loads as a
         waterfall. Preloading starts every fetch while the HTML is still being
         parsed. Keep in step with the imports in main.js. -->
    <link rel="modulepreload" href="main.js" />
    <link rel="modulepreload" href="timing.js" />
    <link rel="modulepreload" href="../adapters/exec.js" />
    <link rel="modulepreload" href="../adapters/source.js" />
    <link rel="modulepreload" href="../core/fuzzy.js" />
    <link rel="modulepreload" href="../core/highlight.js" />
    <link rel="modulepreload" href="../core/items.js" />
    <link rel="modulepreload" href="../core/plan.js" />
    <link rel="modulepreload" href="../core/rank.js" />
    <link rel="modulepreload" href="../messages.js" />
  </head>
  <body>
    <input
      id="query"
      type="text"
      placeholder="Switch to…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Search tabs"
      aria-controls="results"
    />
    <ul id="results" role="listbox" aria-label="Results"></ul>
    <p id="status" class="status" hidden></p>
    <p id="timing" class="timing" hidden></p>
    <script type="module" src="main.js"></script>
  </body>
</html>
