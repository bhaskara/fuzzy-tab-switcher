<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Switch to</title>

    <!-- Styles are inline rather than in popup.css because a script must wait
         for pending stylesheets before it runs, which put the stylesheet's
         fetch on the critical path between the popup opening and the list
         appearing. See ../../DESIGN.md §7. -->
    <style>
      /* Popup chrome: a fixed-width search field over a scrolling result list.
         Chrome sizes the popup to its content, so the width here is the popup
         width (the hard ceiling is 800x600). Colours follow the browser's. */

      :root {
        color-scheme: light dark;

        --bg: #ffffff;
        --fg: #1f1f1f;
        --fg-dim: #5f6368;
        --border: #dadce0;
        --selected-bg: #e8f0fe;
        --match-fg: #1967d2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #292a2d;
          --fg: #e8eaed;
          --fg-dim: #9aa0a6;
          --border: #3c4043;
          --selected-bg: #3c4043;
          --match-fg: #8ab4f8;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 600px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
      }

      #query {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 15px;
      }

      #query:focus {
        outline: none;
      }

      #results {
        max-height: 420px;
        margin: 0;
        padding: 4px 0;
        overflow-y: auto;
        list-style: none;
      }

      .result {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 6px 14px;
        cursor: pointer;
      }

      .result[aria-selected='true'] {
        background: var(--selected-bg);
      }

      /* Both lines are single-line and ellipsized: a wrapping result list makes
         the row height vary, which makes arrow-key navigation feel unsteady. */
      .result-title,
      .result-url {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .result-sub {
        display: flex;
        gap: 6px;
        align-items: baseline;
        min-width: 0;
        font-size: 11px;
      }

      /* The source label keeps its full width; the URL gets ellipsized. */
      .result-kind {
        flex: none;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--fg-dim);
        font-size: 10px;
      }

      .result-url {
        color: var(--fg-dim);
      }

      mark {
        background: none;
        color: var(--match-fg);
        font-weight: 600;
      }

      .status {
        margin: 0;
        padding: 14px;
        color: var(--fg-dim);
      }

      /* Diagnostic only; see popup/timing.js. */
      .timing {
        margin: 0;
        padding: 6px 14px;
        border-top: 1px solid var(--border);
        color: var(--fg-dim);
        font-family: ui-monospace, monospace;
        font-size: 10px;
        white-space: pre;
      }
    </style>

    <!-- Without these the browser cannot discover a module until it has
         fetched and parsed whichever module imports it, so the graph loads as a
         waterfall. Preloading starts every fetch while the HTML is still being
         parsed. Keep in step with the imports in main.js. -->
    <link rel="modulepreload" href="main.js" />
    <link rel="modulepreload" href="timing.js" />
    <link rel="modulepreload" href="../adapters/exec.js" />
    <link rel="modulepreload" href="../adapters/source.js" />
    <link rel="modulepreload" href="../core/fuzzy.js" />
    <link rel="modulepreload" href="../core/highlight.js" />
    <link rel="modulepreload" href="../core/items.js" />
    <link rel="modulepreload" href="../core/plan.js" />
    <link rel="modulepreload" href="../core/rank.js" />
  </head>
  <body>
    <input
      id="query"
      type="text"
      placeholder="Switch to…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Search tabs"
      aria-controls="results"
    />
    <ul id="results" role="listbox" aria-label="Results"></ul>
    <p id="status" class="status" hidden></p>
    <p id="timing" class="timing" hidden></p>
    <script type="module" src="main.js"></script>
  </body>
</html>
